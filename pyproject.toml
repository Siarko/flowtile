[project]
name = "flowtile"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gpiod>=2.5.0",
    "luma-oled>=3.15.0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "parse>=1.20.0",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
